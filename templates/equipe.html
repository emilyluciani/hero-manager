<!-- templates/equipe.html -->
{% extends "base.html" %}
{% block title %}Equipe{% endblock %}

{% block content %}
<h2>Minha Equipe</h2>
<div class="row mt-4">
    {% for h in equipe %}
    <div class="col-md-3 mb-4">
        <div class="card p-2">

            <img src="{{ url_for('static', filename='img/herois/' + h.imagem_url) }}">

            <div class="card-body">
                <h4>{{ h.id }} - {{ h.nome }}</h4>
                <p>{{ h.classe }}</p>

                <form action="/trocar" method="POST" class="mb-2">
                    <input type="hidden" name="uh_id" value="{{ h.uh_id }}">
                    <input type="hidden" name="local" value="base">
                    <button class="btn btn-warning w-100">Mover para Base</button>
                </form>

                <form action="/remover" method="POST">
                    <input type="hidden" name="uh_id" value="{{ h.uh_id }}">
                    <button class="btn btn-danger w-100">Remover</button>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<hr class="my-5">

<h3>Base de Heróis</h3>
<div class="row mt-4">
    {% for h in base %}
    <div class="col-md-3 mb-4">
        <div class="card p-2">

            <img src="{{ url_for('static', filename='img/herois/' + h.imagem_url) }}">

            <div class="card-body">
                <h4>{{ h.id }} - {{ h.nome }}</h4>
                <p>{{ h.classe }}</p>

                <form action="/trocar" method="POST">
                    <input type="hidden" name="uh_id" value="{{ h.uh_id }}">
                    <input type="hidden" name="local" value="equipe">
                    <button class="btn btn-success w-100">Mover para Equipe</button>
                </form>

            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
