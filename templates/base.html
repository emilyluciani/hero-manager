<!-- templates/base.html --> 
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}HeroManager{% endblock %}</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- CSS custom -->
    <style>
        body { background-color: #1a1a1a; color: #fff; }
        .navbar-brand { font-weight: bold; }
        .card { background-color: #2a2a2a; }

        .search-box { position: relative; width: 250px; transition: all 0.4s ease; }
        .search-box:focus-within { width: 420px; }
        .search-input {
            width: 100%; padding: 10px 40px 10px 15px; border: none; outline: none;
            border-radius: 30px; background: #111; color: #fff; transition: all 0.3s ease;
            box-shadow: 0 0 10px #0077ff44;
        }
        .search-input:focus { box-shadow: 0 0 6px #2bb1ff88, 0 0 12px #4bbdff44; }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #aaa; pointer-events: none; transition: 0.3s; }
        .search-box:focus-within .search-icon { color: #4bbdff; text-shadow: 0 0 10px #4bbdff; }

        .autocomplete-list {
            position: absolute; background: #1e1e1e; width: 100%; top: 48px;
            border-radius: 10px; box-shadow: 0 0 15px #000; z-index: 999; max-height: 200px; overflow-y: auto;
        }
        .autocomplete-item { padding: 10px 15px; cursor: pointer; transition: 0.2s; }
        .autocomplete-item:hover { background: #333; text-shadow: 0 0 10px #7d2bff; }
    </style>
</head>

<body>
<nav class="navbar navbar-dark bg-dark navbar-expand-lg mb-4">
    <div class="container">

        {% if session.get('usuario_id') %}

        <a class="navbar-brand d-flex align-items-center gap-2 me-3" href="/home">
            <img src="{{ url_for('static', filename='img/icon.png') }}" class="logo">
            HeroManager
        </a>

        <!-- Botão mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarHM">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu colapsável -->
        <div class="collapse navbar-collapse" id="navbarHM">
            <div class="search-box d-none d-lg-flex align-items-center me-3">
                <form action="/buscar" method="get" class="w-100">
                    <input 
                        type="text" 
                        name="q" 
                        id="searchInput"
                        class="search-input"
                        autocomplete="off"
                        placeholder="Buscar herói por nome ou ID...">
                    <i class="search-icon bi bi-search"></i>
                </form>
                <div id="autocompleteContainer" class="autocomplete-list" style="display:none;"></div>
            </div>

            <ul class="navbar-nav ms-auto mt-3 mt-lg-0">
                <li class="nav-item"><a class="nav-link" href="/herois">Heróis</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipe">Equipe</a></li>
                <li class="nav-item"><a class="nav-link" href="/perfil">Perfil</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="/logout">Sair</a></li>
            </ul>
        </div>


        {% else %}
        <a class="navbar-brand d-flex align-items-center gap-2">
            <img src="{{ url_for('static', filename='img/icon.png') }}" class="logo">
            HeroManager
        </a>

        {% endif %}
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

{% with msgs = get_flashed_messages() %}
    {% if msgs %}
        <script>
            alert("{{ msgs[0] }}");
        </script>
    {% endif %}
{% endwith %}

<script>
const input = document.getElementById("searchInput");
const box = document.getElementById("autocompleteContainer");

if(input) {
    input.addEventListener("input", async () => {
        const q = input.value.trim();
        if (q.length < 1) { box.style.display = "none"; return; }
        const resp = await fetch(`/autocomplete?q=${q}`);
        const dados = await resp.json();
        if (dados.length === 0) { box.style.display = "none"; return; }
        box.innerHTML = "";
        box.style.display = "block";
        dados.forEach(nome => {
            const item = document.createElement("div");
            item.classList.add("autocomplete-item");
            item.textContent = nome;
            
            // ✅ Alteração principal: clicar envia o formulário diretamente
            item.onclick = () => { 
                input.value = nome; 
                box.style.display = "none"; 
                input.form.submit(); // envia direto
            };

            box.appendChild(item);
        });
    });

    document.addEventListener("click", e => {
        if (!input.contains(e.target)) { box.style.display = "none"; }
    });
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
